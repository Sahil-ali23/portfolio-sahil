<body class="bg-ink text-fg font-sans">

  "CTI Correlation", "Risk Classification", "Response Recommendation",
  "Human Approval", "Defense Action"
];

}

    <section id={id} className="max-w-3xl mx-auto px-6 py-20 border-t border-line">
